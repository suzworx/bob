name: Supabase

# Checks the Supabase edge functions under supabase/functions: type check and
# unit tests with Deno. No secrets and no hosted project: deploying supabase/
# (migrations, config, functions) to your own project is a manual step
# (docs/deploy.md).
on:
  pull_request:
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The repo-root package.json would make Deno resolve npm: imports from a
      # node_modules this job never installs; the functions pin their own.
      DENO_NO_PACKAGE_JSON: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
      - name: deno check
        run: deno check supabase/functions/*/index.ts
      - name: deno test
        run: deno test --allow-read --allow-env supabase/functions
