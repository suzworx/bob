<!doctype html>
<html lang="en" data-astryx-theme="bob">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- The status bar matches the top bar: --color-background-body of the bob theme, per scheme. -->
    <meta name="theme-color" content="#f1f1f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1b1b" media="(prefers-color-scheme: dark)" />
    <title>Bob</title>
    <meta name="description" content="Say hi to Bob, your friendly little helper." />
    <link rel="canonical" href="https://app.heybob.xyz/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bob" />
    <meta property="og:description" content="Say hi to Bob, your friendly little helper." />
    <meta property="og:url" content="https://app.heybob.xyz/" />
    <meta property="og:image" content="https://app.heybob.xyz/brand/bob/bob-playful.webp" />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="480" />
    <meta property="og:image:height" content="480" />
    <meta property="og:image:alt" content="Bob, a friendly little helper" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Bob" />
    <meta name="twitter:description" content="Say hi to Bob, your friendly little helper." />
    <meta name="twitter:image" content="https://app.heybob.xyz/brand/bob/bob-playful.webp" />
    <link rel="icon" type="image/png" href="/brand/bob/icon.png" />
    <link rel="apple-touch-icon" href="/brand/bob/apple-icon.png" />
    <script>
      // Pre-paint appearance: Astryx colours the page from html[data-theme]
      // but only stamps it once React has mounted, so a stored light/dark
      // choice would first paint in the OS palette. This stamps the stored
      // choice before the first frame; the Theme then writes the same value
      // (stored as 'bob.theme' in localStorage; 'system' = no key).
      (function () {
        try {
          var theme = window.localStorage.getItem('bob.theme');
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.setAttribute('data-theme', theme);
          }
        } catch (error) {
          /* no stored preference; the system palette applies */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
