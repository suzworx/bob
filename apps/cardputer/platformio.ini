[platformio]
src_dir = src
include_dir = include
; Libraries install here, not in the default .pio/libdeps. A checkout's
; .pio/libdeps can hold a hand-patched, uncommitted library that PlatformIO
; keeps using: a WebSockets copy instrumented in 2026-08 printed
; "[BOB-DIAG] readCb ..." for every read, flooding the product build's
; serial (2026-09-24). A fresh directory gets pristine copies of lib_deps
; without touching (or deleting) the patched one.
libdeps_dir = .pio/libdeps-pristine

[env:m5stack-cardputer-v2-poc]
; Exact: the bootloader and Arduino core (2.0.17) must not move between builds. Bump on purpose.
platform = espressif32@7.0.1
board = m5stack-stamps3
framework = arduino
extra_scripts = pre:scripts/earcons_build.py
monitor_speed = 115200
lib_deps =
  ; Exact, like M5Unified below (#1063): M5Cardputer declares M5Unified "*" and M5GFX "*", so an
  ; open range pulls whatever M5Stack released last into a fresh libdeps.
  m5stack/M5Cardputer@1.1.1
  ; Exact (#1063): every codec, expander and touch register access (ws185_hw.cpp, M5.In_I2C) runs
  ; through M5GFX's lgfx::i2c layer. Unpinned, fresh builds moved silently from 0.2.33 (Oct 16) to
  ; 0.2.34 (Oct 20, a rewrite of the I2C transaction/ownership code). Bump on purpose, after
  ; `T spk test` passes on the Waveshare.
  m5stack/M5GFX@0.2.33
  ; Exact: the capture ring (src/audio_capture.cpp) relies on
  ; Mic_Class::setBufferReleaseCallback and on record() being callable from
  ; that callback, behaviour a newer release may change. Bump on purpose.
  m5stack/M5Unified@0.2.23
  links2004/WebSockets@^2.6.1
  earlephilhower/ESP8266Audio@^1.9.7
  ; TFLite Micro + micro_speech frontend for the wake word (src/wake_word.cpp).
  https://github.com/tanakamasayuki/Arduino_TensorFlowLite_ESP32.git#8572c7217b16bdc912bc38f46ff152e4a4eb11ef
  ; Bob's portable core (ADR 0004, libs/bob-device/README.md), linked from the repo, never copied.
  symlink://../../libs/bob-device
build_flags =
  ; #669: Arduino-core log_e only. Level 3 compiled every log_i/log_w string
  ; into the image and printed raw "[I][...]" lines, which are not journal
  ; lines (scripts/hil cleanSerial rejects them). All envs inherit this.
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DWEBSOCKETS_TCP_TIMEOUT=5000
  ; The WebSockets library's own debug prints (DEBUG_WEBSOCKETS) stay compiled
  ; out even if a DEBUG_ESP_PORT is defined: every serial line is a journal line.
  -DNODEBUG_WEBSOCKETS
  ; #675: developer build. Seeds the saved network and the Dev server from
  ; secrets.h on first boot and allows the Dev/Custom profiles over plain ws://.
  ; A build without it is Production-only and never connects in plain text.
  -DBOB_DEV_OPTIONS=1
  ; src/wake_word.cpp .incbin's the microWakeWord model from here (16-byte aligned).
  -Wa,-I$PROJECT_DIR/lib/wake_models
  ; Alexa remains the default; BOB_WAKE_MODEL_JARVIS selects the existing backup.
  ; BOB_BUILD_ID is HEAD's short sha as a bare token (include/build_id.h):
  ; the boot journal line, the boot/connecting screen, HELP and the HIL
  ; console's `T ping` show it; without git it is empty and they say "dev".
  ; %% is the ini escape for git's %h.
  !git log -1 --format=-DBOB_BUILD_ID=%%h
  ; #345: the firmware version (include/types.h). A release build (CI sets
  ; BOB_FW_VERSION) reports x.y.z; any other build <next x.y.z>-dev+<sha>.
  !node ../../scripts/release/fw-version.mjs

; Hardware-in-the-loop build (docs/cardputer/hil.md): the product firmware
; (build id included) plus the serial test console.
[env:m5stack-cardputer-hil]
extends = env:m5stack-cardputer-v2-poc
build_flags =
  ${env:m5stack-cardputer-v2-poc.build_flags}
  -DBOB_TEST_CONSOLE=1

; Private experimental build: Alexa and the Hey Bob candidate selectable on-device.
; The candidate weights are deliberately outside git:
; data/wake-test/hey_bob.tflite; permission to redistribute remains unclear.
; Starts with the unchanged 28672-byte arena. BOB_WAKE_ARENA_BYTES may override
; its capacity for allocator experiments; measure heap and timing before use.
[env:m5stack-cardputer-bob]
extends = env:m5stack-cardputer-v2-poc
build_flags =
  ${env:m5stack-cardputer-v2-poc.build_flags}
  -DBOB_WAKE_MODEL_BOB=1
  -Wa,-I$PROJECT_DIR/../../data

[env:m5stack-cardputer-bob-hil]
extends = env:m5stack-cardputer-bob
build_flags =
  ${env:m5stack-cardputer-bob.build_flags}
  -DBOB_TEST_CONSOLE=1

; #679: the retail (customer) firmware. The product build without developer
; options: Production only (TLS), no secrets.h seed, and the Server menu
; hidden until `developer` is typed on About (then Custom, TLS only).
[env:m5stack-cardputer-release]
extends = env:m5stack-cardputer-v2-poc
build_unflags = -DBOB_DEV_OPTIONS=1

; Waveshare ESP32-S3-Touch-LCD-1.85C (V2): the Bob dev firmware. Same product sources as
; the Cardputer (src/board_waveshare_185c.cpp implements include/board.h), the Cardputer UI in
; a centred 240x135 viewport, BOOT or a tap as BtnA. This device is Bob: the private Hey Bob
; weights (data/wake-test/hey_bob.tflite, outside git) are the default wake word. The server
; is Production (api.heybob.xyz): scripts/ws185_secrets.py wraps secrets.h so only Wi-Fi is
; taken from it (see that script). Bring-up pieces (bob_art, bob_motion) stay out of the image.
[env:waveshare-s3-185c]
extends = env:m5stack-cardputer-v2-poc
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_8MB.csv
extra_scripts =
  pre:scripts/earcons_build.py
  pre:scripts/ws185_secrets.py
  pre:scripts/bob_rig_flag.py
build_flags =
  ${env:m5stack-cardputer-v2-poc.build_flags}
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -DBOB_BOARD_WAVESHARE_185C=1
  -DBOB_WAKE_MODEL_BOB=1
  -DBOB_DEFAULT_WAKE_BOB=1
  -Wa,-I$PROJECT_DIR/../../data
  ; src/bob_art.cpp .incbin's Bob's RGB565 images from here.
  -Wa,-I$PROJECT_DIR/lib/bob_art
  ; src/round_fonts.cpp .incbin's the Nunito VLW fonts from here.
  -Wa,-I$PROJECT_DIR/lib/fonts
  ; libs/bob-device/src/bob_rig.cpp .incbin's the rig part blobs from here (only with BOB_RIG, see scripts/bob_rig_flag.py).
  -Wa,-I$PROJECT_DIR/lib/bob_art/rig
build_src_filter =
  +<*>
  -<display.cpp>
  -<chrome.cpp>
  -<cards.cpp>
  -<timers_view.cpp>

; Hardware-in-the-loop build for the Waveshare board: the product env plus the serial test console.
[env:waveshare-s3-185c-hil]
extends = env:waveshare-s3-185c
build_flags =
  ${env:waveshare-s3-185c.build_flags}
  -DBOB_TEST_CONSOLE=1

; Square-overlay experiments (#1065): the hil build with every push experiment on (full frames only,
; tinted rect outlines on the glass, tearing-effect sync). Never the default; flash it only to look.
[env:waveshare-s3-185c-hil-exp]
extends = env:waveshare-s3-185c-hil
build_flags =
  ${env:waveshare-s3-185c-hil.build_flags}
  -DBOB_UI_FULL_PUSH=1
  -DBOB_UI_TINT_RECTS=1
  -DBOB_UI_TE_SYNC=1

; Waveshare ESP32-S3-Touch-LCD-1.85C (V2): board drivers + bring-up sketch only
; (bringup/ws185). Same toolchain pins as the Cardputer; it does not extend that
; env and compiles none of the product sources. 16 MB QIO flash, 8 MB octal PSRAM.
[env:waveshare-s3-185c-bringup]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_8MB.csv
monitor_speed = 115200
lib_deps =
  m5stack/M5Unified@0.2.23
  symlink://../../libs/bob-device
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
  -DBOARD_HAS_PSRAM
  -DBOB_BOARD_WAVESHARE_185C=1
  ; src/bob_art.cpp .incbin's Bob's RGB565 images from here.
  -Wa,-I$PROJECT_DIR/lib/bob_art
build_src_filter =
  -<*>
  +<ws185_hw.cpp>
  +<bob_art.cpp>
  +<bob_motion.cpp>
  +<bob_face.cpp>
  +<bob_emotions.cpp>
  +<../bringup/ws185/>

; Colour diagnosis (bringup/ws185_swatch): swatches drawn by fill / pushImage ram / pushImage
; flash, BOOT or a tap toggles the panel inversion. Not part of the product image.
[env:waveshare-s3-185c-swatch]
extends = env:waveshare-s3-185c-bringup
build_src_filter =
  -<*>
  +<ws185_hw.cpp>
  +<bob_art.cpp>
  +<../bringup/ws185_swatch/>
